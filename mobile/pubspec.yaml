name: valora_mobile
description: Valora personal food planning mobile app.
publish_to: none
version: 0.2.1+3

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.5.0
  flutter_edge_ai: 2.5.0
  flutter_edge_ai_litertlm: 1.16.0
  app_links: ^7.2.2
  flutter_secure_storage: ^11.2.0
  url_launcher: ^6.3.3
  flutter_markdown_plus: 1.0.12
  speech_to_text: ^7.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/licenses/GEMMA-4-APACHE-2.0.txt
    - assets/licenses/GEMMA-4-NOTICE.txt
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans.ttf
